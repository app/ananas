name: snap

# Build the Ananas snap inside the official Snapcraft OCI image, the same way
# tools/scripts/build-snap-worktree.sh does locally. The image is the build
# environment, so no host Snapcraft / LXD is involved.
#
# Packages are uploaded as artifacts only from master; pull requests build the
# snap as a check but publish nothing. See tools/GITHUB-CI.md.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'applications/**'
      - 'translations/**'
      - 'snap/**'
      - 'build/**'
      - 'tools/**'
      - '**/CMakeLists.txt'
      - 'VERSION'
      - '.snapcraftignore'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'snap/**'
      - 'build/ubuntu/**'
      - 'debian'
      - 'tools/scripts/build-snap*.sh'
      - 'tools/scripts/build-deb*.sh'
      - 'tools/docker/**'
      - '.snapcraftignore'
      - '**/CMakeLists.txt'
      - 'VERSION'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-amd64:
    name: Build snap (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the snap
        run: bash tools/scripts/build-snap-worktree.sh

      - name: Show the result
        run: ls -lh dist/*.snap

      - name: Upload the snap
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: ananas-snap-amd64
          path: 'dist/*.snap'
          if-no-files-found: error

  # Optional: build for arm64 on Launchpad. Enable and provide store/LP
  # credentials (see tools/GITHUB-CI.md). Not needed for amd64.
